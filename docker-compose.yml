services:
  backend:
    build:
      context: ./backend
    environment:
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      AIRCRAFT_PROVIDERS: ${AIRCRAFT_PROVIDERS:-airplaneslive,adsbfi,adsblol,opensky}
      AIRPLANESLIVE_BASE_URL: ${AIRPLANESLIVE_BASE_URL:-https://api.airplanes.live/v2}
      AIRPLANESLIVE_TIMEOUT_SECONDS: ${AIRPLANESLIVE_TIMEOUT_SECONDS:-12}
      ADSBFI_BASE_URL: ${ADSBFI_BASE_URL:-https://opendata.adsb.fi/api}
      ADSBFI_TIMEOUT_SECONDS: ${ADSBFI_TIMEOUT_SECONDS:-12}
      ADSBLOL_BASE_URL: ${ADSBLOL_BASE_URL:-https://api.adsb.lol}
      ADSBLOL_TIMEOUT_SECONDS: ${ADSBLOL_TIMEOUT_SECONDS:-12}
      OPENSKY_CLIENT_ID: ${OPENSKY_CLIENT_ID:-}
      OPENSKY_CLIENT_SECRET: ${OPENSKY_CLIENT_SECRET:-}
      OPENSKY_TIMEOUT_SECONDS: ${OPENSKY_TIMEOUT_SECONDS:-12}
      CACHE_TTL_SECONDS: ${CACHE_TTL_SECONDS:-8}
      OVERHEAD_THRESHOLD_KM: ${OVERHEAD_THRESHOLD_KM:-8}
    ports:
      - "8000:8000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 10s

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8000}
        NEXT_PUBLIC_POLL_INTERVAL_MS: ${NEXT_PUBLIC_POLL_INTERVAL_MS:-30000}
    environment:
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8000}
      NEXT_PUBLIC_POLL_INTERVAL_MS: ${NEXT_PUBLIC_POLL_INTERVAL_MS:-30000}
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
